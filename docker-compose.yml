services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
    # L'API ne démarre que quand PostgreSQL est vraiment prêt
    # (pas juste lancé, mais capable d'accepter des connexions)
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      # Volume nommé = les données PostgreSQL survivent aux restarts
      # Sans ça, toutes tes tâches disparaissent à chaque docker compose down
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # pg_isready vérifie que PostgreSQL accepte des connexions
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # Limite Redis à 128 MB de RAM
    # allkeys-lru = supprime les clés les moins utilisées si plein
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      # Seul Nginx est exposé sur l'hôte — l'API n'est pas accessible directement
      - "80:80"
    volumes:
      # :ro = read-only, Nginx n'a pas besoin d'écrire dans sa config
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata: